name: Pismo Brewing Trend Digest

# GitHub Actions cron always runs in UTC and does not adjust for DST.
# 9:00 AM Pacific is 16:00 UTC during PDT (Mar–Nov) and 17:00 UTC during
# PST (Nov–Mar). We schedule both and use a guard step so only the run
# matching the *current* Pacific offset actually executes.
# Manual runs (via the Actions tab "Run workflow" button) always bypass the
# guard and execute immediately, regardless of the time.
on:
  schedule:
    - cron: "0 16 * * 1"   # Monday 9:00 AM PDT (daylight saving)
    - cron: "0 17 * * 1"   # Monday 9:00 AM PST (standard time)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Guard — only run at 9:00 AM Pacific (skipped for manual runs)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — bypassing time guard."
            exit 0
          fi
          PT_HOUR=$(TZ="America/Los_Angeles" date +%H)
          if [ "$PT_HOUR" != "09" ]; then
            echo "Current Pacific hour is $PT_HOUR, not 09. Skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout repo
        if: env.SKIP != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.SKIP != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: env.SKIP != 'true'
        run: pip install -r requirements.txt

      - name: Run weekly trend digest
        if: env.SKIP != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
        run: python fetch_intel.py

      - name: Commit updated digest
        if: env.SKIP != 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          DATE=$(date -u '+%Y-%m-%d')
          mkdir -p history
          cp trend_digest.json history/trend_digest_${DATE}.json 2>/dev/null || true
          git add trend_digest.json history/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: trend digest ${DATE}"
          git push
